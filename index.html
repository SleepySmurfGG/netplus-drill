<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N10-009 Drill</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #17202a;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --teal: #1aa6a1;
      --gold: #c9a227;
      --good: #3dd68c;
      --bad: #ff6b6b;
      --line: #2a3644;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.02em; }
    header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    main { max-width: 760px; margin: 0 auto; padding: 1.25rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    button, select {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.primary { background: var(--teal); color: #042422; border-color: transparent; font-weight: 650; }
    button:disabled { opacity: 0.45; cursor: default; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
    }
    .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }
    .q { font-size: 1.05rem; line-height: 1.45; margin-bottom: 0.9rem; }
    .choice {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0.4rem 0;
      padding: 0.7rem 0.8rem;
    }
    .choice.correct { border-color: var(--good); background: #163325; }
    .choice.wrong { border-color: var(--bad); background: #3a1a1a; }
    .why { margin-top: 0.9rem; padding: 0.75rem 0.85rem; background: #101820; border-radius: 8px; color: #c5d0da; font-size: 0.92rem; line-height: 1.4; }
    .score { color: var(--gold); font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.5rem; margin-top: 1rem; }
    .stat { background: #101820; border-radius: 8px; padding: 0.7rem; }
    .stat b { display: block; font-size: 1.2rem; }
    .stat span { color: var(--muted); font-size: 0.78rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>N10-009 Drill</h1>
      <p>Your weak areas — routing, SVI, STP, cable, topology, OSI</p>
    </div>
    <div class="score" id="running">0 / 0</div>
  </header>
  <main>
    <div class="row">
      <select id="cat"></select>
      <button class="primary" id="start">Start set</button>
      <button id="ten">10-min mix (12 Q)</button>
      <button id="missed">Missed only</button>
    </div>
    <div id="home" class="card">
      <p>Pick a category or run a 10-minute mixed set. Answers and a one-line why show after each pick. Misses are saved in this browser.</p>
      <div class="grid" id="stats"></div>
    </div>
    <div id="quiz" class="card" hidden></div>
  </main>
  <footer>Local study tool for CompTIA Network+ N10-009. Not affiliated with CompTIA.</footer>
  <script src="questions.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const missedKey = "n10009-missed";
    const loadMissed = () => JSON.parse(localStorage.getItem(missedKey) || "[]");
    const saveMissed = (ids) => localStorage.setItem(missedKey, JSON.stringify([...new Set(ids)]));

    const catSel = $("cat");
    catSel.innerHTML = '<option value="all">All categories</option>' +
      Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");

    let queue = [];
    let i = 0;
    let correct = 0;
    let answered = 0;

    function pool(cat) {
      if (cat === "all") return [...QUESTION_BANK];
      if (cat === "missed") {
        const ids = loadMissed();
        return QUESTION_BANK.filter(q => ids.includes(q.id));
      }
      return QUESTION_BANK.filter(q => q.cat === cat);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let n = a.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [a[n], a[j]] = [a[j], a[n]];
      }
      return a;
    }

    function renderStats() {
      const ids = loadMissed();
      $("stats").innerHTML = `
        <div class="stat"><b>${QUESTION_BANK.length}</b><span>questions in bank</span></div>
        <div class="stat"><b>${ids.length}</b><span>missed (this browser)</span></div>
        <div class="stat"><b>${Object.keys(CATEGORIES).length}</b><span>categories</span></div>`;
    }

    function start(list) {
      queue = shuffle(list);
      i = 0; correct = 0; answered = 0;
      $("home").hidden = true;
      $("quiz").hidden = false;
      show();
    }

    function show() {
      $("running").textContent = `${correct} / ${answered}`;
      if (i >= queue.length) {
        $("quiz").innerHTML = `<h2>Done — ${correct} / ${answered}</h2>
          <p class="why">${answered ? Math.round(correct / answered * 100) : 0}% · Misses stay in Missed only.</p>
          <button class="primary" id="again">Home</button>`;
        $("again").onclick = () => { $("quiz").hidden = true; $("home").hidden = false; renderStats(); };
        return;
      }
      const raw = queue[i];
      const order = shuffle(raw.choices.map((_, idx) => idx));
      const q = {
        ...raw,
        choices: order.map(idx => raw.choices[idx]),
        a: order.indexOf(raw.a)
      };
      queue[i] = q;
      $("quiz").innerHTML = `
        <div class="meta">${CATEGORIES[q.cat] || q.cat} · ${i + 1} of ${queue.length}</div>
        <div class="q">${q.q}</div>
        ${q.choices.map((c, idx) => `<button class="choice" data-i="${idx}">${String.fromCharCode(65 + idx)}. ${c}</button>`).join("")}
        <div id="fb"></div>`;
      $("quiz").querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => grade(q, Number(btn.dataset.i));
      });
    }

    function grade(q, pick) {
      answered++;
      const ok = pick === q.a;
      if (ok) correct++;
      else saveMissed([...loadMissed(), q.id]);
      if (ok) {
        const rest = loadMissed().filter(id => id !== q.id);
        saveMissed(rest);
      }
      $("quiz").querySelectorAll(".choice").forEach(btn => {
        btn.disabled = true;
        const idx = Number(btn.dataset.i);
        if (idx === q.a) btn.classList.add("correct");
        if (idx === pick && !ok) btn.classList.add("wrong");
      });
      $("fb").innerHTML = `<div class="why"><strong>${ok ? "Correct." : "Wrong."}</strong> ${q.why}</div>
        <p><button class="primary" id="next">Next</button></p>`;
      $("running").textContent = `${correct} / ${answered}`;
      $("next").onclick = () => { i++; show(); };
    }

    $("start").onclick = () => start(pool(catSel.value));
    $("ten").onclick = () => start(shuffle(QUESTION_BANK).slice(0, 12));
    $("missed").onclick = () => {
      const list = pool("missed");
      if (!list.length) { alert("No missed questions saved yet."); return; }
      start(list);
    };
    renderStats();
  </script>
</body>
</html>
